[tools]
python = "3.13"
uv = "0.12"
vale = "3.26"
gitleaks = "8.30"
"npm:markdownlint-cli2" = "0.24"

[tasks."docs:setup"]
description = "Create the documentation virtual environment"
run = """
python3 -m venv .venv
.venv/bin/python -m pip install --quiet --upgrade pip
.venv/bin/python -m pip install --quiet -r docs/requirements.txt
"""

[tasks."docs:structure"]
description = "Check the structure and the mechanical prose rules"
run = "python3 scripts/check_docs.py"

[tasks."docs:prose"]
description = "Check the style with Vale"
run = "vale docs README.md AGENTS.md"

[tasks."docs:spell"]
description = "Check the spelling with codespell"
depends = ["docs:setup"]
run = ".venv/bin/codespell"

[tasks."docs:style"]
description = "Lint the Markdown"
run = "markdownlint-cli2"

[tasks."docs:build"]
description = "Build the site and fail on any warning"
depends = ["docs:setup"]
run = ".venv/bin/zensical build --strict --clean"

[tasks."docs:serve"]
description = "Serve the documentation locally"
depends = ["docs:setup"]
run = ".venv/bin/zensical serve"

[tasks."docs:fix"]
description = "Apply the automatic fixes that exist"
depends = ["docs:setup"]
run = """
markdownlint-cli2 --fix
.venv/bin/codespell --write-changes
"""

[tasks."docs:check"]
description = "Run every documentation check"
run = """
set -e
mise run docs:setup
mise run docs:structure
mise run docs:spell
mise run docs:style
mise run docs:prose
mise run docs:build
"""

[tasks."secrets:check"]
description = "Scan the full history for a secret"
run = "gitleaks git --redact --no-banner --exit-code 1 ."

[tasks."secrets:staged"]
description = "Scan the staged changes for a secret"
run = "gitleaks git --redact --no-banner --exit-code 1 --staged ."

[tasks.check]
description = "Run every check"
depends = ["docs:check", "secrets:check"]
